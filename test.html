<!DOCTYPE html>
<html>
<head><title>Webhook Test</title></head>
<body>
<h3>Bot Test</h3>
<button onclick="sendAlert()">Alert Bhejo</button>
<p id="result"></p>

<script>
function sendAlert() {
  fetch("https://tradingviewalerts-2.onrender.com/webhook/tera_token", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Webhook-Secret": "tera_secret"
    },
    body: JSON.stringify({
      "symbol": "RELIANCE",
      "price": 3000,
      "condition": "Test Alert"
    })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("result").innerText = "Response: " + JSON.stringify(data)
  })
  .catch(err => {
    document.getElementById("result").innerText = "Error: " + err
  })
}
</script>
</body>
</html>
